[package]
name = "desktop-pet"
version = "0.1.0"
description = "A desktop pet application"
authors = ["kk"]
edition = "2021"

[lib]
name = "desktop_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rdev = "0.5"
gilrs = { version = "0.10", default-features = false, features = ["xinput"] }
